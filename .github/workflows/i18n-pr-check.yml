name: i18n PR check

# Per-PR translation gate. Two independent halves in one job.
#
# 1. Fragment gate. Every new translatable string on this PR's added
#    lines must have an entry with a non-empty msgstr in the PR's
#    fragment under `languages/pending/` (or already ship translated).
#    `tools/check-i18n-fragment.php` names the strings that don't.
#
#    This replaced (#3864) a gate that regenerated the .pot on both the
#    merge base and the head, msgmerged each into a copy of the .po, and
#    failed when the untranslated count grew. That was accurate and hard
#    to act on — it reported "Empty-msgstr delta: 3 (baseline=9,
#    head=12)" next to "New untranslated msgids: 0", and reading the two
#    together as "you added three strings and translated none" took real
#    effort. It also needed wp-cli, gettext and a second worktree to
#    produce a number nobody could reproduce locally.
#
#    The author can still override with the `i18n-drift-acceptable`
#    label, e.g. when a feature lands faster than the translator.
#
# 2. Hardcoded-English leak grep — Table C leak classes (Audit 4 /
#    #1178): literal English in `wp_die(...)`, as the 2nd arg to
#    `WP_Error(...)`, or as a `sprintf(...)` format string. Unchanged.
#
# Separation of concerns vs. the other workflows:
# - `translations.yml` validates .po syntax + warns on empty msgstr
#   counts. It doesn't gate.
# - `po-duplicate-lint.yml` runs `tools/check-po-duplicates.php`, which
#   covers the fragments too.
# - `i18n-drift-report.yml` reports the whole-catalogue gap weekly.

on:
  pull_request:
    paths:
      - 'src/**/*.php'
      - 'languages/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  drift-gate:
    name: Fragment gate + hardcoded-English grep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate diffs against the merge base, so it needs history.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # A fragment that duplicates a msgid, carries an obsolete entry or
      # leaves a msgstr empty is refused here, in the PR that wrote it —
      # not at release time, where it blocks the whole batch and the
      # author who could fix it in a minute has moved on.
      - name: Validate the PR's translation fragments
        shell: bash
        run: |
          set -e
          git fetch origin main:refs/remotes/origin/main
          php tools/consolidate-translations.php --check
          php tools/check-po-duplicates.php --base=origin/main

      - name: Every new string has a translation
        id: fragment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          php tools/check-i18n-fragment.php --base=origin/main --format=github \
            2>&1 | tee "$RUNNER_TEMP/i18n-fragment.log"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::check-i18n-fragment could not run (exit $status)."
            exit "$status"
          fi

          override=$(jq -r '.pull_request.labels[]?.name' "$GITHUB_EVENT_PATH" \
            | grep -Fxc 'i18n-drift-acceptable' || true)
          if [ "$override" -gt 0 ]; then
            echo "::notice::Label 'i18n-drift-acceptable' present — untranslated strings accepted."
            exit 0
          fi

          {
            echo "## Untranslated strings in this PR"
            echo ""
            echo "Every new translatable string needs an entry with a Dutch \`msgstr\` in this PR's fragment — one new file, \`languages/pending/<issue>-<slug>.po\`. Do not edit \`languages/talenttrack-nl_NL.po\`; see [\`languages/pending/README.md\`](../blob/main/languages/pending/README.md)."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/i18n-fragment.log"
            echo '```'
            echo ""
            echo "Reproduce locally — no gettext tooling needed:"
            echo ""
            echo '```'
            echo "php tools/check-i18n-fragment.php"
            echo '```'
            echo ""
            echo "Or label this PR \`i18n-drift-acceptable\` to ship the English for now; the weekly drift report still records the strings."
          } > "$RUNNER_TEMP/i18n-fragment-comment.md"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "$RUNNER_TEMP/i18n-fragment-comment.md" || true

          echo "::error::This PR adds translatable strings with no Dutch translation."
          exit 1

      # Bonus: hardcoded-English leak grep (Audit 4 Table C).
      # We scan only the files changed in the PR — false-positive
      # sweeps across the whole src/ tree are not the point of a PR
      # check. The intent: catch new leaks at the moment they land.
      - name: Hardcoded-English leak grep (Table C)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          git fetch origin main:refs/remotes/origin/main || true
          base_sha=$(git merge-base HEAD origin/main)
          changed=$(git diff --name-only --diff-filter=AM "$base_sha"...HEAD \
            -- 'src/**/*.php' || true)

          if [ -z "$changed" ]; then
            echo "No changed PHP files under src/ — skipping leak grep."
            exit 0
          fi

          fail=0
          report="$RUNNER_TEMP/leak-report.md"
          : > "$report"

          # Pattern A: wp_die(" Capital   — literal English in wp_die().
          patternA='wp_die\(\s*['"'"'"][A-Z]'
          # Pattern B: WP_Error('code', "Capital   — literal English as
          # 2nd arg to WP_Error().
          patternB='WP_Error\(\s*['"'"'"][a-z_]+['"'"'"]\s*,\s*['"'"'"][A-Z]'
          # Pattern C: sprintf("Capital   — literal English as the
          # format string of sprintf().
          patternC='sprintf\(\s*['"'"'"][A-Z]'

          for pat_label_pair in \
            "A:$patternA:wp_die() with literal English string" \
            "B:$patternB:WP_Error() with literal English as 2nd arg" \
            "C:$patternC:sprintf() with literal English format string"; do
            label=${pat_label_pair%%:*}
            rest=${pat_label_pair#*:}
            pat=${rest%%:*}
            desc=${rest#*:}

            hits=""
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ ! -f "$f" ] && continue
              # `grep -E -n` returns matching lines with line numbers.
              # Skip lines where the literal is wrapped in __() / _e() /
              # esc_html__() / esc_attr__() — those go through gettext.
              matches=$(grep -En "$pat" "$f" \
                | grep -vE '__\(|_e\(|esc_html__\(|esc_attr__\(|_x\(|_n\(' \
                || true)
              if [ -n "$matches" ]; then
                hits+="$f:\n$matches\n\n"
              fi
            done <<< "$changed"

            if [ -n "$hits" ]; then
              {
                echo "### Pattern $label — $desc"
                echo ""
                echo '```'
                printf "%b" "$hits"
                echo '```'
                echo ""
              } >> "$report"
              fail=1
            fi
          done

          if [ "$fail" -eq 1 ]; then
            {
              echo "## Hardcoded English leaks detected (Audit 4 Table C)"
              echo ""
              echo "The following lines in this PR look like user-facing English strings that bypass the gettext layer. Wrap them in \`__()\` / \`_e()\` / \`esc_html__()\` so translators can localise them."
              echo ""
              cat "$report"
              echo ""
              echo "_Refs #1223 + #1178. False positive? Reply on this PR and we'll tune the pattern._"
            } > "$RUNNER_TEMP/leak-comment.md"

            gh pr comment "${{ github.event.pull_request.number }}" \
              --body-file "$RUNNER_TEMP/leak-comment.md" || true
            echo "::error::Hardcoded English leak(s) found in changed PHP files."
            exit 1
          fi

          echo "OK — no hardcoded-English leak patterns in changed files."
