name: i18n sync (.pot → .po)

# Regenerate `talenttrack.pot` from PHP source on every push to main
# that touches PHP, then `msgmerge` it into every `.po` so missing
# entries appear (with empty `msgstr`) and translators see the gap.
#
# Why this exists: the .pot template at `languages/talenttrack.pot`
# was last regenerated 2026-04-20. Four weeks of shipping later
# (entire Tournaments module, expanded REST validation messages,
# Prospects + PersonaDashboard polish) added ~570 user-visible
# strings via `__()` / `esc_html__()` / `_e()` that were never
# captured in the .pot, so the .po never grew the corresponding
# msgids, so the Dutch site falls back to English for all of them.
#
# This workflow keeps the gap from re-opening: every PHP-touching
# merge to main re-extracts strings, msgmerges into .po, and
# commits the result. The compile step in translations.yml then
# regenerates the .mo from the updated .po on the next push.
#
# Manual trigger: workflow_dispatch button on the Actions page,
# for explicit re-syncs (e.g. after a translation backfill PR
# merges and we want to re-baseline).

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.php'
      - 'includes/**/*.php'
      - 'talenttrack.php'
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs against the same branch. Two PHP-touching merges landing
# close together (routine during a queue drain) otherwise race: run B checks
# out main before run A has pushed its sync commit, so B's push is
# non-fast-forward and gets rejected. Queue rather than cancel — a cancelled
# run would drop its .pot/.po sync entirely, which is the gap this workflow
# exists to close.
concurrency:
  group: i18n-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-pot:
    name: Regenerate .pot + msgmerge into .po
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: wp-cli

      - name: Install gettext (for msgmerge)
        run: |
          sudo apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y gettext -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15

      # #3218 — regenerate against the CURRENT tip, never rebase.
      #
      # This used to be three steps: extract, msgmerge, then commit with a
      # `git pull --rebase` before the push to survive a main that had
      # moved. That rebase is what failed on back-to-back merges. It has to
      # replay a sync commit onto a main whose `.pot` the *next* run has
      # already rewritten, and `.gitattributes` gives `languages/*.po` a
      # union driver but deliberately not `talenttrack.pot` — union on a
      # `.pot` would produce duplicate msgids, which msgfmt treats as fatal,
      # trading a red workflow for a broken artifact.
      #
      # The `.pot` is a pure function of the source tree, so generating it
      # against a stale checkout is the actual mistake. Reset to the tip
      # first and there is never a `.pot` to reconcile: on a rejected push
      # we throw the work away and redo it against the new tip, which is
      # cheap and always correct.
      #
      # `wp i18n make-pot` is WordPress's official .pot generator — it knows
      # the gettext keyword conventions (__/_e/_n/_x/esc_html__/…) and
      # filters by text-domain natively. `--skip-audit` skips its lint pass;
      # ours lives in release.yml.
      #
      # msgmerge -U updates each .po in place: new msgids appear with an
      # empty msgstr, obsoleted ones are commented out with `#~`.
      # `--no-fuzzy-matching` stops it guessing that a new string is a
      # renamed old one, which is brittle.
      - name: Regenerate, merge and push (retrying against a moved main)
        env:
          REF: ${{ github.ref_name }}
        run: |
          attempt=1
          max=3

          while [ "$attempt" -le "$max" ]; do
            echo "::group::i18n sync — attempt $attempt of $max"

            # Start from whatever the branch is right now.
            git fetch origin "$REF"
            git reset --hard "origin/$REF"

            wp i18n make-pot . languages/talenttrack.pot --slug=talenttrack --skip-audit

            for po in languages/*.po; do
              echo "Merging $po"
              msgmerge --update --backup=none --no-fuzzy-matching "$po" languages/talenttrack.pot
            done

            if [ -z "$(git status --porcelain languages/)" ]; then
              echo "No translation file changes; nothing to push."
              echo "::endgroup::"
              exit 0
            fi

            # `wp i18n make-pot` rewrites POT-Creation-Date on every run, so
            # the date alone is not a real change and must not produce a
            # commit. The .po files are the meaningful signal.
            po_changed=$(git status --porcelain languages/*.po 2>/dev/null | wc -l)
            pot_real_change=$(git diff --unified=0 -- languages/talenttrack.pot 2>/dev/null \
              | grep -E '^[-+]' \
              | grep -vE '^[-+]"POT-Creation-Date|^[-+]{3}' \
              | wc -l)

            if [ "$po_changed" -eq 0 ] && [ "$pot_real_change" -eq 0 ]; then
              echo "Only POT-Creation-Date changed; skipping commit."
              git checkout -- languages/
              echo "::endgroup::"
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add languages/talenttrack.pot languages/*.po
            git commit -m "chore(i18n): sync .pot from PHP source + msgmerge into .po"

            if git push origin "HEAD:$REF"; then
              echo "Committed i18n sync."
              echo "::endgroup::"
              exit 0
            fi

            echo "$REF moved while this ran; regenerating against the new tip."
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done

          echo "::error::i18n sync could not push after $max attempts — $REF is moving faster than a full extraction takes."
          exit 1
