name: i18n sync (.pot → .po)

# Manual re-sync of the translation catalogue: regenerate
# `languages/talenttrack.pot` from PHP source, `msgmerge` it into every
# `.po` so missing entries appear (with empty `msgstr`) and translators
# see the gap, then commit the result to the branch it ran on.
#
# #3865 — this used to run on EVERY push to main that touched PHP, and
# commit. That put every open PR one commit behind on `languages/*.po`,
# a file GitHub cannot auto-merge, so merging PR n forced a local merge
# and a full CI re-run on PRs n+1…N. Measured on the 2026-09-20 drain:
# ~20 avoidable integrate-and-push cycles across 22 PRs, and the tail of
# the drain took longer than the implementation.
#
# The catalogue is now regenerated at RELEASE time instead, by
# `auto-release.yml`, which runs the same script (`tools/i18n-sync.sh`)
# immediately before it recompiles the `.mo` files — so the published
# `.mo` is built from the synced `.po`, and the catalogue can never move
# while PRs are open.
#
# What is left here is the escape hatch: a workflow_dispatch button on
# the Actions page, for an explicit re-sync between releases (e.g. after
# a translation backfill merges and we want to re-baseline, or if the
# release-time sync warned that it could not push).

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs against the same branch. Two dispatches landing close
# together otherwise race: run B checks out the branch before run A has
# pushed its sync commit, so B's push is non-fast-forward and gets
# rejected. Queue rather than cancel — a cancelled run would drop its
# .pot/.po sync entirely.
concurrency:
  group: i18n-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-pot:
    name: Regenerate .pot + msgmerge into .po
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: wp-cli

      - name: Install gettext (for msgmerge)
        run: |
          sudo apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y gettext -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15

      # #3218 — regenerate against the CURRENT tip, never rebase.
      #
      # This used to be three steps: extract, msgmerge, then commit with a
      # `git pull --rebase` before the push to survive a branch that had
      # moved. That rebase is what failed on back-to-back runs. It has to
      # replay a sync commit onto a tip whose `.pot` the *next* run has
      # already rewritten, and `.gitattributes` gives `languages/*.po` a
      # union driver but deliberately not `talenttrack.pot` — union on a
      # `.pot` would produce duplicate msgids, which msgfmt treats as fatal,
      # trading a red workflow for a broken artifact.
      #
      # The `.pot` is a pure function of the source tree, so generating it
      # against a stale checkout is the actual mistake. Reset to the tip
      # first and there is never a `.pot` to reconcile: on a rejected push
      # we throw the work away and redo it against the new tip, which is
      # cheap and always correct.
      - name: Regenerate, merge and push (retrying against a moved branch)
        env:
          REF: ${{ github.ref_name }}
        run: |
          attempt=1
          max=3

          while [ "$attempt" -le "$max" ]; do
            echo "::group::i18n sync — attempt $attempt of $max"

            # Start from whatever the branch is right now.
            git fetch origin "$REF"
            git reset --hard "origin/$REF"

            if ! bash tools/i18n-sync.sh; then
              echo "::endgroup::"
              echo "::error::Catalogue regeneration failed — see the log above."
              exit 1
            fi

            if [ -z "$(git status --porcelain languages/)" ]; then
              echo "No translation file changes; nothing to push."
              echo "::endgroup::"
              exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add languages/talenttrack.pot languages/*.po
            git commit -m "chore(i18n): sync .pot from PHP source + msgmerge into .po"

            if git push origin "HEAD:$REF"; then
              echo "Committed i18n sync."
              echo "::endgroup::"
              exit 0
            fi

            echo "$REF moved while this ran; regenerating against the new tip."
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done

          echo "::error::i18n sync could not push after $max attempts — $REF is moving faster than a full extraction takes."
          exit 1
