name: PHP tests (#1388)

# PHP test floor — the first PHPUnit suite for the plugin. Runs inside
# wp-env's `tests-cli` container (the same WordPress + MySQL environment
# the Playwright E2E job uses), so tests exercise real WP + DB behaviour.
#
# Tier 1: MigrationRunner failure surfacing + AuthorizationService /
# authorization-matrix decisions (the authz regression class that bit the
# board six times — #1143/#1105/#1106/#1147/#1159/#1189). Tier 2 (REST
# smoke suite) is added under the same suite. See docs/contributing.md.
#
# This is a REQUIRED, blocking gate (the suite must be green to merge) and
# it self-validated on its own introducing PR. New REST endpoints must add
# a smoke test (contributing.md policy).

on:
  # #3090 — no `branches:` filter on `pull_request`. The event only fires
  # for pull requests in the first place, so the filter's entire effect was
  # to skip PRs whose base is not `main` — which is exactly the case that
  # needs covering. A stacked PR ran neither suite and still showed a green
  # column, which is worse than showing none. A glob of feature-branch
  # patterns was considered and rejected: it keeps a filter whose only
  # remaining job is to be incomplete, and it fails silently the first time
  # somebody stacks onto a base the pattern misses.
  #
  # The `push` trigger below keeps its `branches: [main]`. That one is the
  # post-merge net and is correct as it stands.
  pull_request:
    paths:
      - 'src/**'
      - 'tests/php/**'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - '.wp-env.json'
      - '.github/workflows/php-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/php/**'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - '.wp-env.json'
      - '.github/workflows/php-tests.yml'

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (wp-env)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # #2417 — pin where wp-env keeps its working files instead of trusting
      # the default. The first attempt at the cache below silently saved
      # nothing ("Path Validation Error: Path(s) specified in the action for
      # caching do(es) not exist"), because `~/.wp-env` is only wp-env's
      # default on some platforms and versions. Naming it makes the cache
      # path and the tool agree by construction rather than by coincidence,
      # and survives a wp-env upgrade that moves the default again.
      WP_ENV_HOME: /home/runner/.wp-env
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      # Unlike e2e.yml, this job DOES need composer: the runtime tree is
      # committed but PHPUnit and the Yoast polyfills are not, and the
      # suite runs `vendor/bin/phpunit`.
      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          # No composer.lock in the repo, so composer.json is the best
          # available key; a dependency bump there invalidates the cache.
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci || npm install

      # #2417 — wp-env's own working directory. `.wp-env.json` sets
      # `"core": "WordPress/WordPress"`, so wp-env git-clones the WordPress
      # repository into `~/.wp-env/<hash>/WordPress` and reuses it forever
      # after. On a CI runner "forever after" never arrives: the clone is
      # cold on every single run. Caching that directory is what turns the
      # clone into a restore.
      #
      # The key carries a week stamp as well as the config hash, so a cache
      # entry ages out after seven days rather than pinning the suites to
      # whatever trunk looked like the day it was written. `restore-keys`
      # lets a stale entry still be used as a starting point while the fresh
      # one is being written.
      - name: Cache wp-env core + downloads
        id: wp-env-cache
        uses: actions/cache@v4
        with:
          path: ~/.wp-env
          key: ${{ runner.os }}-wp-env-${{ hashFiles('.wp-env.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-wp-env-${{ hashFiles('.wp-env.json') }}-

      # #2417 — the breakdown the issue asked for, recorded in the log of
      # every run rather than reconstructed after the fact from a stopwatch.
      # `Start wp-env` was one 95s block with no internal detail; these
      # markers separate the image pull from everything wp-env does after it,
      # and report whether the core cache was warm, which is the difference
      # the cache above is meant to make.
      # A pre-pull step was tried here and REMOVED after measuring it —
      # candidate 1 in #2417, ruled out with a number rather than an
      # opinion. Pulling `wordpress` / `wordpress:cli` / `mariadb:lts` ahead
      # of wp-env cost 28s and took nothing off wp-env's own 92s, because
      # wp-env resolves its own tags and pulls them regardless. Net effect
      # was +25s. Image pull is roughly 28s of the startup; it is not the
      # part worth attacking, and the way to find that out was to try it.
      - name: Start wp-env (timed)
        run: |
          set -e
          echo "TT_TIMING core_cache_hit=${{ steps.wp-env-cache.outputs.cache-hit || 'false' }}"
          if [ -d "$HOME/.wp-env" ]; then
            echo "TT_TIMING wp_env_dir_size=$( du -sh "$HOME/.wp-env" | cut -f1 )"
          else
            echo "TT_TIMING wp_env_dir_size=absent"
          fi
          start=$( date +%s )
          npm run wp-env:start
          echo "TT_TIMING wp_env_start_seconds=$(( $( date +%s ) - start ))"

      - name: Run PHPUnit (Tier 1)
        # wp-env mounts the plugin (incl. the host-installed vendor/) into
        # the tests container and provides the WordPress PHPUnit library;
        # bootstrap.php picks it up via WP_PHPUNIT__DIR.
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/talenttrack vendor/bin/phpunit
