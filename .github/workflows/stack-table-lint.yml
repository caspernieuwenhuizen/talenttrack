name: Stack-table primitive

# #4810 — the stacked-label table (each cell a "LABEL  value" line on a
# phone, the label from `data-label`) lives in one place:
# assets/css/components/stack-table.css, with StackTable::attrs() writing
# the markup. It used to be written out by hand in nine stylesheets, each a
# little different. This fails any stylesheet outside the primitive that
# writes `content: attr(data-label)`.
#
# One named exception: frontend-mobile.css's legacy phone stack, which
# labels the `.tt-table`s not yet on the primitive (tt-table-tools.js copies
# the header text onto their cells). The #4810 decision keeps it until the
# tables move, under epic #4908:
# https://github.com/caspernieuwenhuizen/talenttrack/issues/4810#issuecomment-6599880029
#
# The second step counts those tables: the frontend PHP and JS lines that
# write a `tt-table` class without the primitive, against the exact baseline in
# .github/stack-table-legacy-baseline.txt. A new one fails; one that moves
# fails until the baseline is lowered, so the count only falls.

on:
  pull_request:
    paths:
      - 'assets/css/**'
      - 'src/**/*.php'
      - 'assets/js/**'
      - '.github/stack-table-legacy-baseline.txt'
      - '.github/workflows/stack-table-lint.yml'
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: One stack-table primitive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Fail on a data-label line outside the primitive
        shell: bash
        run: |
          set -e

          PRIMITIVE='assets/css/components/stack-table.css'
          # The legacy phone stack: kept by the #4810 decision until epic
          # #4908 moves its tables onto the primitive.
          EXCEPTION='assets/css/frontend-mobile.css'

          if [ ! -f "$PRIMITIVE" ]; then
            echo "::error file=$PRIMITIVE::The stack-table primitive is missing."
            exit 1
          fi

          HITS=$(grep -rlE 'content:[[:space:]]*attr\([[:space:]]*data-label[[:space:]]*\)' --include='*.css' assets/css || true)

          BAD=()
          for f in $HITS; do
            [ "$f" = "$PRIMITIVE" ] && continue
            [ "$f" = "$EXCEPTION" ] && continue
            BAD+=( "$f" )
          done

          if [ ${#BAD[@]} -gt 0 ]; then
            for f in "${BAD[@]}"; do
              echo "::error file=$f::Writes content: attr(data-label) outside the stack-table primitive."
            done
            echo ""
            echo "Use the primitive instead: add 'tt-stack-table tt-stack-table--to-480'"
            echo "(or --to-768) to the table through StackTable::classes(), write the"
            echo "roles and data-label with StackTable::attrs(), and keep only the"
            echo "surface's own padding, borders and label typography in its sheet."
            echo "See assets/css/components/stack-table.css and #4810."
            exit 1
          fi

          if ! echo "$HITS" | grep -qxF "$EXCEPTION"; then
            echo "::error file=.github/workflows/stack-table-lint.yml::$EXCEPTION no longer writes its own data-label line; remove the exception (epic #4908 is done)."
            exit 1
          fi

          echo "OK — the data-label line is written only by the primitive and by one named exception:"
          echo "  $EXCEPTION, the legacy phone stack, kept by the #4810 decision until epic #4908 moves its tables:"
          echo "  https://github.com/caspernieuwenhuizen/talenttrack/issues/4810#issuecomment-6599880029"

      - name: Count the tables still on the legacy phone stack
        shell: bash
        run: |
          set -e

          BASELINE='.github/stack-table-legacy-baseline.txt'

          # A frontend line that writes `tt-table` as a quoted class token
          # (not `tt-table-wrap` and the like, not the `.tt-table` of a
          # selector or a comment) without the primitive: in PHP markup,
          # whether the class is written in place or built in a variable or
          # array, and in a table a script builds. wp-admin pages are out:
          # the legacy stack does not load there.
          TOKEN="[\"' ]tt-table([\"' ]|\$)"
          legacy_lines() {
            {
              grep -rnE "$TOKEN" --include='*.php' src | grep -vE '^src/Modules/[^/]+/Admin/' || true
              grep -rnE "$TOKEN" --include='*.js' assets/js || true
            } | grep -v -e 'tt-stack-table' -e 'StackTable::classes(' || true
          }

          CURRENT=$(legacy_lines | cut -d: -f1 | LC_ALL=C sort | uniq -c | awk '{ print $2 " " $1 }')
          EXPECTED=$(grep -vE '^[[:space:]]*(#|$)' "$BASELINE" | LC_ALL=C sort)

          total() { echo "$1" | awk 'NF { n += $2 } END { print n + 0 }'; }

          if [ "$CURRENT" = "$EXPECTED" ]; then
            echo "OK — $(total "$CURRENT") line(s) in $(echo "$CURRENT" | grep -c .) file(s) still print a .tt-table on the legacy phone stack (epic #4908), as the baseline says."
            exit 0
          fi

          FAIL=0
          # Every file in either list, with its count now and in the baseline.
          FILES=$( { echo "$CURRENT"; echo "$EXPECTED"; } | awk 'NF { print $1 }' | LC_ALL=C sort -u )
          for f in $FILES; do
            now=$(echo "$CURRENT" | awk -v f="$f" '$1 == f { print $2 }')
            was=$(echo "$EXPECTED" | awk -v f="$f" '$1 == f { print $2 }')
            now=${now:-0}
            was=${was:-0}
            if [ "$now" -gt "$was" ]; then
              FAIL=1
              legacy_lines | grep -F "$f:" | while IFS=: read -r path line rest; do
                echo "::error file=$path,line=$line::A .tt-table on the legacy phone stack. Build the table through StackTable::classes() / StackTable::attrs() (docs/architecture-mobile-first.md, Stacked tables); epic #4908 is moving the rest."
              done
              echo "$f: $now legacy line(s), the baseline allows $was."
            elif [ "$now" -lt "$was" ]; then
              FAIL=1
              echo "::error file=$BASELINE::$f now has $now legacy line(s), the baseline says $was. Lower it in $BASELINE (or remove the line at 0), so the count stays exact."
            fi
          done

          if [ "$FAIL" = 1 ]; then
            echo ""
            echo "The current count, in the baseline's own shape:"
            echo "$CURRENT"
            exit 1
          fi
