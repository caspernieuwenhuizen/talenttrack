name: Auto-release on version bump

# #1376 — PUC auto-update on pilot sites checks the latest GitHub
# RELEASE (talenttrack.php wires `enableReleaseAssets()`), but the
# release job in release.yml only fires on manual tag pushes. Tags
# lagged main by dozens of versions, so client sites saw no update
# for days. This workflow closes the gap: every version bump that
# lands on `main` publishes a release automatically.
#
# Mechanics:
#   1. Read `Version:` from the talenttrack.php plugin header.
#   2. If release `v<version>` already exists → no-op (idempotent;
#      re-runs, reverts, and non-bump pushes touching this file are
#      all safe).
#   3. Sync the translation catalogue (#3865) — regenerate the `.pot`
#      from PHP source, `msgmerge` into every `.po`, push that to
#      `main`. This is the ONLY scheduled place the catalogue is
#      regenerated; `i18n-sync.yml` is a manual escape hatch now. It
#      runs before the `.mo` recompile below so the published `.mo` is
#      built from the synced `.po`.
#   4. Build the plugin ZIP — same steps as release.yml's `release`
#      job + release-tag.yml (gettext, composer no-dev, msgfmt loop,
#      rsync excludes).
#   5. Create the release via softprops/action-gh-release with an
#      explicit tag_name + target_commitish — the release API creates
#      the tag in the same call, no separate `git push --tags`
#      needed. Tags created by GITHUB_TOKEN don't re-trigger
#      release.yml's tag-push job, so nothing double-publishes.
#
# The tag-push path in release.yml and the manual escape hatch in
# release-tag.yml both stay — the release-exists check here prevents
# collisions in every direction.

on:
  push:
    branches:
      - main
    paths:
      - 'talenttrack.php'

permissions:
  contents: write

jobs:
  auto-release:
    name: Publish release for the version on main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Read plugin version
        id: version
        run: |
          version=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' talenttrack.php)
          if [ -z "$version" ]; then
            echo "::error::Could not parse Version: header from talenttrack.php."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Plugin version on main: $version"

      - name: Check whether the release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" \
               --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} does not exist yet — building."
          fi

      - name: Install gettext
        if: steps.exists.outputs.exists == 'false'
        run: |
          sudo apt-get update -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y gettext -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15

      - name: Setup PHP
        if: steps.exists.outputs.exists == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2, wp-cli

      # #3865 — the translation catalogue is regenerated HERE, once per
      # release, and nowhere else on a schedule. It used to run on every
      # PHP-touching push to main and commit, which put every open PR one
      # commit behind on a file GitHub cannot auto-merge.
      #
      # Order matters twice over:
      #   - BEFORE the .mo recompile below, so the published .mo is built
      #     from the synced .po rather than the pre-sync one.
      #   - BEFORE `composer install --no-dev`, so `wp i18n make-pot` scans
      #     the same committed vendor/ tree the old push-triggered run saw.
      #     Extracting against a pruned tree would produce a different .pot.
      #
      # Never fatal. A release that cannot ship because catalogue
      # housekeeping hiccuped is strictly worse than a release with a
      # slightly stale catalogue — pilot sites auto-update from the
      # release, and an unsynced msgid just falls back to English, which
      # is what it already did before this ran. Failures surface as a
      # warning annotation on the run; re-run the `i18n sync` workflow
      # manually to catch main up. `tools/i18n-sync.sh` restores
      # `languages/` to HEAD on any failure, so a half-merged catalogue
      # can never reach the ZIP.
      - name: Sync translation catalogue (.pot + msgmerge) and push to main
        id: i18n
        if: steps.exists.outputs.exists == 'false'
        env:
          REF: ${{ github.ref_name }}
        run: |
          if ! bash tools/i18n-sync.sh; then
            echo "::warning::Translation catalogue sync failed; releasing with the catalogue as committed on main. Run the 'i18n sync' workflow manually to catch up."
            exit 0
          fi

          if [ -z "$(git status --porcelain languages/)" ]; then
            echo "Catalogue already in sync; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add languages/talenttrack.pot languages/*.po
          git commit -m "chore(i18n): sync .pot from PHP source + msgmerge into .po"

          if git push origin "HEAD:$REF"; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Pushed the synced catalogue to $REF."
          else
            echo "::warning::$REF moved while the release ran, so the synced catalogue could not be pushed. The ZIP below still contains it; run the 'i18n sync' workflow manually to catch main up."
          fi

      # Kept, deliberately: this builds the SHIPPED ZIP. `--no-dev` prunes
      # the dev tree out of the artifact and `--optimize-autoloader`
      # rebuilds the classmap for it, so the committed vendor/ is not a
      # substitute here.
      - name: Install production dependencies
        if: steps.exists.outputs.exists == 'false'
        run: |
          if [ -f composer.json ] && grep -q '"require"' composer.json && ! grep -q '"require": *{ *}' composer.json; then
            composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
          fi

      # Runs on the .po the step above just synced, so the shipped .mo
      # carries every msgid the source tree has at this version.
      - name: Regenerate .mo files from .po (always fresh in release ZIP)
        if: steps.exists.outputs.exists == 'false'
        run: |
          for po in languages/*.po; do
            mo="${po%.po}.mo"
            echo "Compiling $po → $mo"
            msgfmt -o "$mo" "$po"
          done

      - name: Build plugin ZIP
        if: steps.exists.outputs.exists == 'false'
        run: |
          mkdir -p /tmp/build
          # vendor/ is bundled (production deps only — phpstan + szepeviktor are dev-only).
          rsync -av \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='tests' --exclude='phpstan*' \
            --exclude='vendor/bin' --exclude='vendor/phpstan' --exclude='vendor/szepeviktor' \
            --exclude='branding-plugin' \
            ./ /tmp/build/talenttrack/
          cd /tmp/build
          zip -r talenttrack.zip talenttrack

      - name: Create GitHub Release (tag created via the release API)
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Tag the catalogue-sync commit when there was one, so the tagged
          # tree matches the ZIP's translations; otherwise the version bump
          # itself.
          target_commitish: ${{ steps.i18n.outputs.sha != '' && steps.i18n.outputs.sha || github.sha }}
          files: /tmp/build/talenttrack.zip
          generate_release_notes: true
