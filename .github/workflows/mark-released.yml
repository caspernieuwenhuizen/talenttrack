name: Mark board items as Released

# When a release tag lands, find every issue closed by commits in this release
# (parsed from `Closes #NNN` / `Fixes #NNN` / `Resolves #NNN` in commit messages)
# and flip its TalentTrack pilot issues board Status from "Merged" → "Released".
#
# Two-stage Done was introduced in v3.110.169:
#   - PR merge → board Status = Merged (PR is in `main`, not yet shipped to users)
#   - Release tag → board Status = Released (pilot can update to a build with this fix)
#
# How it is triggered (#5153):
#   - workflow_call — the normal path. auto-release.yml calls this as its last
#     job, with the tag it just published. auto-release creates the tag through
#     the release API with GITHUB_TOKEN, and GitHub starts no workflow from an
#     event GITHUB_TOKEN caused, so the tag push below never fires for it.
#   - push: tags — a tag pushed by hand (release.yml's manual flow).
#   - workflow_dispatch — a missed release, by hand: Actions → this workflow →
#     Run workflow, with `tag` (e.g. v4.150.0). `from_tag` widens the range to
#     every commit after that tag, so one run catches up several releases:
#     tag = v4.150.0, from_tag = v4.145.0 covers v4.146.0 to v4.150.0.
#
# Project: caspernieuwenhuizen/projects/2 (TalentTrack pilot issues)
# Status field: PVTSSF_lAHOEHnNVs4BYFxrzhTOAFw
# Released option id: da029a71

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'The release tag, e.g. v4.150.0'
        required: true
        type: string
    secrets:
      PROJECT_BOARD_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag, e.g. v4.150.0'
        required: true
        type: string
      from_tag:
        description: 'Optional: start after this tag instead of the previous one (catch-up over several releases)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

jobs:
  flip-status:
    name: Flip referenced issues to Released
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Discover commits and referenced issues
        id: discover
        env:
          # A call or a dispatch names the tag; a tag push is the tag.
          TAG: ${{ inputs.tag || github.ref_name }}
          FROM_TAG: ${{ inputs.from_tag || '' }}
        run: |
          set -e
          if ! git rev-parse -q --verify "refs/tags/${TAG}"; then
            echo "::error::Tag ${TAG} does not exist."
            exit 1
          fi
          if [ -n "$FROM_TAG" ]; then
            if ! git rev-parse -q --verify "refs/tags/${FROM_TAG}"; then
              echo "::error::Tag ${FROM_TAG} does not exist."
              exit 1
            fi
            PREV="$FROM_TAG"
          else
            # Previous tag in tag-sorted order (semver-friendly via -V).
            PREV=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1 || true)
          fi
          if [ -z "$PREV" ] || [ "$PREV" = "$TAG" ]; then
            echo "No previous tag found; falling back to last 50 commits before ${TAG}"
            RANGE="-n 50 ${TAG}"
          else
            echo "Comparing ${PREV}..${TAG}"
            RANGE="${PREV}..${TAG}"
          fi
          # shellcheck disable=SC2086
          RANGE_LOG=$(git log --pretty=format:%B $RANGE)
          # Extract issue numbers from `Closes #NNN` / `Fixes #NNN` / `Resolves #NNN`
          # in a commit typed by hand. Case-insensitive; numbers deduplicated.
          ISSUES=$(echo "$RANGE_LOG" \
            | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?)\s*#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -un || true)
          # #5153 — a squash merge keeps the PR's title, "Title (#PR)", not
          # its body, so the `Closes #N` lines are not in the commit. The
          # PR numbers are; the next step asks GitHub what each one closed.
          # shellcheck disable=SC2086
          PRS=$(git log --pretty=format:%s $RANGE \
            | grep -oE '\(#[0-9]+\)$' \
            | grep -oE '[0-9]+' \
            | sort -un || true)
          ISSUES_CSV=$(echo "$ISSUES" | tr '\n' ' ' | sed 's/ *$//')
          PRS_CSV=$(echo "$PRS" | tr '\n' ' ' | sed 's/ *$//')
          echo "Found issues in commit messages: ${ISSUES_CSV:-<none>}"
          echo "Found merged PRs: ${PRS_CSV:-<none>}"
          echo "issues=${ISSUES_CSV}" >> "$GITHUB_OUTPUT"
          echo "prs=${PRS_CSV}" >> "$GITHUB_OUTPUT"

      - name: Add the issues each merged PR closed
        id: closing
        env:
          # A read of this repository: the workflow's own token, so the
          # board token's GraphQL budget is kept for the board.
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ steps.discover.outputs.issues }}
          PRS: ${{ steps.discover.outputs.prs }}
        run: |
          set -e
          FOUND="$ISSUES"
          # 50 PRs per query, one alias each. issueOrPullRequest, so a
          # "(#N)" that names an issue rather than a PR answers null for
          # that alias instead of failing the whole query.
          # shellcheck disable=SC2086
          set -- $PRS
          while [ "$#" -gt 0 ]; do
            FIELDS=""
            i=0
            while [ "$#" -gt 0 ] && [ "$i" -lt 50 ]; do
              FIELDS="${FIELDS} p$1: issueOrPullRequest(number: $1) { ... on PullRequest { closingIssuesReferences(first: 20) { nodes { number } } } }"
              shift
              i=$((i + 1))
            done
            NUMBERS=$(gh api graphql \
              -f query="query { repository(owner: \"${GITHUB_REPOSITORY_OWNER}\", name: \"talenttrack\") { ${FIELDS} } }" \
              --jq '.data.repository[]? | .closingIssuesReferences?.nodes[]?.number' \
              || true)
            FOUND="${FOUND} ${NUMBERS}"
          done
          ALL=$(echo "$FOUND" | tr ' ' '\n' | grep -E '^[0-9]+$' | sort -un | tr '\n' ' ' | sed 's/ *$//' || true)
          echo "Issues to mark Released: ${ALL:-<none>}"
          echo "issues=${ALL}" >> "$GITHUB_OUTPUT"

      - name: Flip Status to Released
        if: steps.closing.outputs.issues != ''
        env:
          # Project-V2 writes need a PAT with `project` scope; the default
          # GITHUB_TOKEN does not have it. Repo secret `PROJECT_BOARD_TOKEN`
          # must hold a fine-grained PAT (user account: caspernieuwenhuizen,
          # scope: projects:read+write).
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
          ISSUES: ${{ steps.closing.outputs.issues }}
        run: |
          set -e
          PROJECT_NUMBER=2
          OWNER="caspernieuwenhuizen"
          PROJECT_ID="PVT_kwHOEHnNVs4BYFxr"
          FIELD_ID="PVTSSF_lAHOEHnNVs4BYFxrzhTOAFw"
          RELEASED_ID="da029a71"

          for n in $ISSUES; do
            echo "── #${n}"

            # Locate the project item id for this issue. If the issue isn't on
            # the board (rule was applied retroactively or someone filed it
            # outside the workflow), skip silently — don't break the release.
            ITEM_ID=$(gh api graphql \
              -f query='query($owner:String!,$num:Int!){repository(owner:$owner,name:"talenttrack"){issue(number:$num){projectItems(first:5){nodes{id project{number}}}}}}' \
              -f owner="$OWNER" -F num="$n" \
              --jq ".data.repository.issue.projectItems.nodes[] | select(.project.number == ${PROJECT_NUMBER}) | .id" \
              || true)

            if [ -z "$ITEM_ID" ]; then
              echo "   not on board; skipping"
              continue
            fi

            gh project item-edit \
              --id "$ITEM_ID" \
              --project-id "$PROJECT_ID" \
              --field-id "$FIELD_ID" \
              --single-select-option-id "$RELEASED_ID" \
              > /dev/null

            echo "   flipped to Released"
          done
