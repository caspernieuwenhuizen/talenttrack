name: TalentTrack E2E (#12)

on:
  # #3090 — deliberately no `branches:` filter here. See the note in
  # php-tests.yml: `pull_request` only fires for pull requests, so the
  # filter's whole effect was to skip stacked PRs, which are the ones that
  # were merging untested behind a green column. The `push` filter stays.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # #2417 — pin wp-env's working directory so the cache below and the
      # tool agree on it. See the longer note in php-tests.yml: trusting the
      # default cached nothing at all, silently.
      WP_ENV_HOME: /home/runner/.wp-env
    steps:
      - uses: actions/checkout@v5

      # No host PHP toolchain here: every PHP process in this job runs
      # inside wp-env's containers, and nothing on the runner shells out to
      # php or composer once the install step below is gone.

      # No `composer install` here: the plugin's whole runtime tree
      # (phpspreadsheet, dompdf and their dependencies) plus
      # `vendor/autoload.php` are committed, so the checkout already
      # carries everything `talenttrack.php` loads. Installing on top only
      # added the dev tree this job never uses — and, with no
      # `composer.lock` in the repo, re-resolved runtime versions on every
      # run. Using the committed tree is both faster and deterministic.
      # (php-tests.yml still installs: PHPUnit is NOT committed.)

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci || npm install

      # Restore the browser binaries (~30s of download per run otherwise).
      # Keyed on the resolved Playwright version so a version bump misses
      # the cache and re-downloads, which is exactly what should happen.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        # On a cache hit the binaries are already in place, but the system
        # libraries `--with-deps` installs are not cached (they live in
        # /usr/lib), so still run install-deps.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # #2417 — the WordPress source tree only; see the longer note in
      # php-tests.yml for why the path is the `WordPress` subdirectory and
      # not `~/.wp-env` itself (caching wp-env's own state restores a
      # docker-compose project with no containers behind it, and the job
      # dies on "Error establishing a database connection").
      - name: Cache the WordPress source wp-env clones
        id: wp-env-cache
        uses: actions/cache@v4
        with:
          path: ~/.wp-env/**/WordPress
          key: ${{ runner.os }}-wp-core-${{ hashFiles('.wp-env.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-wp-core-${{ hashFiles('.wp-env.json') }}-

      # See php-tests.yml: a pre-pull step was measured here too and removed.
      # It cost 28s and saved nothing, because wp-env pulls its own tags.
      - name: Start wp-env (timed)
        run: |
          set -e
          echo "TT_TIMING core_cache_hit=${{ steps.wp-env-cache.outputs.cache-hit || 'false' }}"
          if [ -d "$HOME/.wp-env" ]; then
            echo "TT_TIMING wp_env_dir_size=$( du -sh "$HOME/.wp-env" | cut -f1 )"
          else
            echo "TT_TIMING wp_env_dir_size=absent"
          fi
          start=$( date +%s )
          npm run wp-env:start
          echo "TT_TIMING wp_env_start_seconds=$(( $( date +%s ) - start ))"

      - name: Activate plugin + run migrations on tests instance
        # wp-env mounts the plugin but doesn't auto-activate it in the
        # tests environment. Activate explicitly + flush rewrites so
        # the routes the smoke test exercises are wired up.
        # v3.102.1 (#0086 Workstream B Child 1 sprint 3) — turn the
        # per-club MFA enforcement off in CI by writing an empty
        # `mfa_required_personas` to `tt_config`. Without this the
        # default policy (`academy_admin` + `head_of_development`
        # gated) kicks in for the test admin user and the login spec
        # never reaches the dashboard URL — it's redirected into the
        # enrollment wizard. MFA-specific E2E coverage will land in
        # a separate spec file with its own setup.
        run: |
          npx wp-env run tests-cli wp plugin activate talenttrack
          npx wp-env run tests-cli wp rewrite flush --hard
          npx wp-env run tests-cli wp option update permalink_structure '/%postname%/'
          npx wp-env run tests-cli wp rewrite flush --hard
          npx wp-env run tests-cli wp db query "INSERT INTO wp_tt_config (club_id, config_key, config_value) VALUES (1, 'mfa_required_personas', '[]') ON DUPLICATE KEY UPDATE config_value='[]'"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      # #2813 — the mobile viewport gate, at 390x844 with touch enabled.
      # Walks every phone-reachable surface asserting no horizontal
      # overflow, no sub-48px tap target and no over-wide table on a
      # `native` surface.
      #
      # Reporting, not blocking, on purpose. The audit found 2,213 defect
      # rows and a gate that fails on all of them is a gate somebody turns
      # off. `tests/e2e/mobile-baseline.json` starts empty, so the first
      # run prints the real offender list in that file's own shape — paste
      # it in and the gate is calibrated to what CI actually sees. As the
      # fix waves land the baseline shrinks; when it is empty, drop the
      # `continue-on-error` below and this becomes a blocking gate.
      #
      # It reuses the wp-env instance the step above already paid ~82s to
      # start, which is why it lives here rather than in its own workflow.
      - name: Mobile viewport gate (reporting)
        continue-on-error: true
        run: npm run test:e2e:mobile
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npm run wp-env:stop || true
